<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 340px;
      padding: 40px 24px;
      text-align: center;
    }

    .app-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #bbb;
      margin-bottom: 32px;
    }

    .search-input {
      width: 100%;
      border: none;
      border-bottom: 1.5px solid #ddd;
      outline: none;
      font-size: 16px;
      color: #333;
      padding: 6px 0;
      background: transparent;
      text-align: center;
    }

    .search-input::placeholder {
      color: #ccc;
    }

    .search-btn {
      display: inline-block;
      margin-top: 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #2a9d8f;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    /* Weather result */
    .result {
      margin-top: 40px;
      text-align: center;
    }

    .result-city {
      font-size: 13px;
      color: #999;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .result-time {
      font-size: 11px;
      color: #ccc;
      margin-bottom: 12px;
    }

    .result-temp {
      font-size: 64px;
      font-weight: 700;
      color: #222;
      line-height: 1;
    }

    .result-unit {
      font-size: 28px;
      font-weight: 400;
      color: #aaa;
      vertical-align: super;
    }

    .result-icon {
      display: block;
      margin: 8px auto;
      width: 64px;
      height: 64px;
    }

    .result-desc {
      font-size: 14px;
      color: #666;
      margin-bottom: 6px;
    }

    .result-feels {
      font-size: 12px;
      color: #bbb;
      margin-bottom: 10px;
    }

    .result-details {
      font-size: 12px;
      color: #aaa;
    }

    /* Plain error text */
    .error-msg {
      margin-top: 24px;
      font-size: 14px;
      color: #aaa;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-title">Weather App</div>
    <input class="search-input" id="cityInput" type="text" placeholder="Enter a city…">
    <div>
      <button class="search-btn" id="searchBtn">Search</button>
    </div>

    <div class="result hidden" id="result">
      <div class="result-city" id="resultCity"></div>
      <div class="result-time" id="resultTime"></div>
      <div class="result-temp" id="resultTemp"></div>
      <img class="result-icon" id="resultIcon" alt="">
      <div class="result-desc" id="resultDesc"></div>
      <div class="result-feels" id="resultFeels"></div>
      <div class="result-details" id="resultDetails"></div>
    </div>

    <div class="error-msg hidden" id="errorMsg"></div>
  </div>

  <script>
    const input   = document.getElementById('cityInput');
    const btn     = document.getElementById('searchBtn');
    const result  = document.getElementById('result');
    const errorEl = document.getElementById('errorMsg');

    function hideAll() {
      result.classList.add('hidden');
      errorEl.classList.add('hidden');
    }

    async function search() {
      const city = input.value.trim();
      if (!city) return;

      hideAll();

      let data;
      try {
        const res = await fetch('/api/weather?city=' + encodeURIComponent(city));
        data = await res.json();
      } catch {
        errorEl.textContent = 'The weather service is unavailable right now. Please try again later.';
        errorEl.classList.remove('hidden');
        return;
      }

      if (data.error) {
        errorEl.textContent = data.error;
        errorEl.classList.remove('hidden');
        return;
      }

      document.getElementById('resultCity').textContent   = data.city + ', ' + data.country;
      document.getElementById('resultTime').textContent   = data.localTime;
      document.getElementById('resultTemp').innerHTML     = data.tempC + '<span class="result-unit">°C</span>';
      document.getElementById('resultIcon').src           = 'https:' + data.icon;
      document.getElementById('resultIcon').alt           = data.description;
      document.getElementById('resultDesc').textContent   = data.description;
      document.getElementById('resultFeels').textContent  = 'Feels like ' + data.feelsLikeC + '°C';
      document.getElementById('resultDetails').textContent =
        'Humidity ' + data.humidity + '% · Wind ' + data.windKph + ' km/h ' + data.windDir;

      result.classList.remove('hidden');
    }

    btn.addEventListener('click', search);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') search();
    });
  </script>
</body>
</html>
